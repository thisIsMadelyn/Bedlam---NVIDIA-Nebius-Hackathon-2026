[project]
name = "bedlam"
version = "0.1.0"
description = "Adversarial chaos agent: breaks a live system, reads your patch, breaks it again."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.54.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bedlam"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
