[project]
name = "bedlam"
version = "0.1.0"
description = "Adversarial chaos agent: breaks a live system, reads your patch, breaks it again."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.54.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "asyncpg>=0.30.0",
    "redis>=5.1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.7.0", "pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bedlam"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored dependency, never ours to lint or reformat.
extend-exclude = ["targets/fastapi-boilerplate"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
